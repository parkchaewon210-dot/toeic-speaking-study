.         She is holding a shopping bag.\n 25\n\n ☐        그는 물건을 집으려고 손을 뻗고 있어요.   He is reaching for an item.\n 26\n\n ☐        그는 비닐봉지를 들고 있어요.         He is holding a plastic bag.\n 27\n\n\n\n\n                                                                         Page 14 of 33"}, {"page": 15, "part": 2, "text": "시험장에 데려가는 시계토끼 만능문장 포켓북\n\n\n 체크 한국어                          English\n\n ☐  그는 한 손을 들고 있어요.              He is raising his hand.\n 28\n\n ☐        그녀는 문서를 들고 있어요.        She is holding a document.\n 29\n\n ☐        그는 발표를 하고 있어요.         He is making a presentation.\n 30\n\n ☐ 31     그는 태블릿을 사용하고 있어요.      He is using a tablet PC.\n\n ☐        그들은 문서를 읽고 있어요.        They are reading a document.\n 32\n\n ☐        그는 옷걸이에 옷을 걸고 있어요.     He is hanging his clothes on a rack.\n 33\n\n ☐        그녀는 종이 한 장을 줍고 있어요.    She is picking up a piece of paper.\n 34\n\n ☐        사진을 찍고 있는 한 남자가 있어요.   There is a man taking a picture.\n 35\n\n ☐        그녀는 개를 산책시키고 있어요.      She is walking a dog.\n 36\n\n ☐ 37     그는 바닥에 누워 있어요.         He is lying on the ground.\n\n ☐        그녀는 유모차를 밀고 있어요.       She is pushing a baby stroller.\n 38\n\n ☐        그는 보트를 타고 있어요.         He is riding a boat.\n 39\n\n ☐        그는 트럭에 상자를 싣고 있어요.     He is loading a box into a truck.\n 40\n\n ☐ 41     그는 해변 의자에서 쉬고 있어요.     He is relaxing on a beach chair.\n\n ☐        그들은 계단을 내려가고 있어요.      They are walking down the stairs.\n 42\n\n ☐        그들은 길을 건너고 있어요.        They are crossing the street.\n 43\n\n ☐        그들은 길을 걸어가고 있어요.       They are walking on the street.\n 44\n\n\n\n\n                                                                        Page 15 of 33"}, {"page": 16, "part": 3, "text": "시험장에 데려가는 시계토끼 만능문장 포켓북\n\n\n 체크 한국어                                       English\n\n ☐  그녀는 스마트폰을 보고 있어요.                         She is looking at a smartphone.\n 45\n\n ☐        그들은 공연하고 있어요.                       They are performing.\n 46\n\n\n\nPART 3 | Questions 5-7 :                        듣고, 질문에 답하기\n의문사 만능패턴 (MP3 PB03)\n1. Who\n누구와 ~? (Who ~?)\n      with my friend(s) 내 친구(들)와\n      with my best friends 내 가장 친한 친구들과\n      with my family 내 가족과\n\nQ: Who do you usually go with when you go to a café? A: I usually go with my friend when I\ngo to a café. Q:   카페에 갈 때 주로 누구와 함께 가시나요? A: 저는 카페에 갈 때 주로 친구와 함께 갑니\n다.\n2. Where\n★ 빈출 ❶ 어디서 사나요? (Where do you buy ~?)\n   on the internet 인터넷에서\n   at a shopping mall 쇼핑몰에서\n   at a department store 백화점에서\n\nQ: Where do you usually buy clothes? A: I usually buy clothes on the internet. Q:   옷은 주로\n어디서 구매하시나요? A: 저는 주로 인터넷에서 옷을 삽니다.\n★빈출 ❷ 주로 어디서 ~하나요? (Where do you usually ~?)\n\n  at home 집에서\n  at school 학교에서\n  on the subway 지하철에서\n\nQ: Where do you usually play mobile games? A: I usually play mobile games at home/at\n               모바일 게임은 주로 어디서 하시나요? A: 저는 주로 집에서 / 학교에서 / 지\nschool/on the subway. Q:\n하철에서 모바일 게임을 합니다.\n\n                                                                                     Page 16 of 33"}, {"page": 17, "part": 3, "text": "시험장에 데려가는 시계토끼 만능문장 포켓북\n\n\n★ 빈출 ❸ 어디서 정보를 얻나요? (Where do you get information ~?)\n   on the internet 인터넷에서\n   from social media 소셜미디어에서\n   from my friends 친구에게서\n   from books 책에서\n\nQ: Where do you usually get information about where to buy home cleaning products? A: I\n                                                       가\nusually get information about where to buy home cleaning products on the internet. Q:\n정용 청소용품을 어디서 구매할지에 대한 정보를 주로 어디서 얻으시나요? A: 저는 가정용 청소용품을 어\n디서 구매할지에 대한 정보를 주로 인터넷에서 얻습니다.\n3. When\n★ 빈출 ❶ 주로 언제 ~하나요? (When do you usually ~?)\n   when I have spare time 시간이 날 때\n   on weekends 주말에\n   in the summer 여름에\n\nQ: When do you usually visit museums? A: I usually visit museums when I have spare time.\nQ: 박물관을 주로 언제 방문하시나요? A: 저는 주로 시간이 날 때 박물관을 방문합니다.\n★빈출 ❷ 언제 ~했나요? (When did you ~?)\n\n    two weeks ago 2주 전에\n    yesterday 어제\n    last year 작년에\n\nQ: When did you buy your shoes? A: I bought my shoes two weeks ago. Q: 신발은 언제 구입\n하셨나요? A: 저는 2주 전에 신발을 샀습니다.\n★빈출 ❸ 마지막으로 언제 ~했나요? (When was the last time you [과거 동사] ~?)\n\n    The last time I [과거 동사] was two weeks ago / yesterday / last year. 제가 마지막으로 ~한\n    것은 2주 전 / 어제 / 작년입니다.\nQ: When was the last time you went to a park? A: The last time I went to a park was two\nweeks ago. Q: 마지막으로 공원에 갔던 게 언제였나요? A: 저는 마지막으로 공원에 간 게 2주 전입니다.\n❹ 보통 하루 중 언제 ~하나요? (What time of the day do you usually ~?)\n\n   in the morning 오전에\n   at noon 정오에\n   in the afternoon 오후에\n   in the evening 저녁에\n\n\n\n\n                                                                                   Page 17 of 33"}, {"page": 18, "part": 3, "text": "시험장에 데려가는 시계토끼 만능문장 포켓북\n\n\n    at night 밤에\n    all day 하루 종일\n\nQ: What time of the day do you usually go to the movies? A: I usually go to the movies in\nthe morning because it's less crowded in the morning. Q: 보통 하루 중 언제 영화를 보러 가시나\n요? A: 저는 아침에 사람이 덜 붐비기 때문에 주로 아침에 영화를 보러 갑니다.\n❺ 일년 중 언제 ~하나요? (What time of the year ~?)\n\n    in the summer 여름에\n    in the winter 겨울에\n\nQ: What time of the year do you read books most? A: I read books in the winter most. Q: 일\n년 중 언제 책을 가장 많이 읽으시나요? A: 저는 겨울에 책을 가장 많이 읽습니다.\n4. How\n★빈출 ❶ 얼마나 자주 ~하나요? (How often ~? / How frequently ~? / How many times ~?)\n    twice a week 일주일에 두 번\n    almost every day 거의 매일\n    once in a while 가끔씩\n\nQ: How often do you shop for clothes? A: I shop for clothes twice a week. Q: 옷 쇼핑은 얼마\n나 자주 하시나요? A: 저는 일주일에 두 번 옷을 쇼핑해요.\n★빈출 ❷ 얼마나 오래 ~해 왔나요? (How long have you p.p. ~?)\n\n    I have p.p. + for 기간.\n        기간: 숫자 + minutes / hours / days / weeks / months / years — 분 / 시간 / 일 / 주 / 달 /\n        년\nQ: How long have you lived in your current neighborhood? A: I have lived in my current\nneighborhood for 3 years. Q:   현재 동네에 얼마나 오래 거주하셨나요? A: 저는 현재 동네에서 3년째\n살고 있어요.\n❸ [동사]하는 데 얼마나 걸리나요? (How long does it take you to [동사]?)\n\n   It takes 기간 (for 사람) to [동사].\n   ~이 [동사]하는 데 ~ 걸려요.\n\nQ: How long does it take you to finish reading a book? A: It takes function flash(){let cs=shuffledCards();if(!cs.length){app.innerHTML='암기카드가 없습니다.';return}state.idx=Math.max(0,Math.min(state.idx,cs.length-1));let c=cs[state.idx],known=cs.filter(c=>progress[id(c)]).length;app.innerHTML=`<section class="panel"><div class="row">${partSel()}<span class="pill">${cs.length}개 카드</span></div><p class="muted">암기 완료 ${known} / ${cs.length} · 카드는 무작위 순서로 나와요.</p><div class="row"><button id="reshuffle">🔀 다시 섞기</button><span class="muted">누르면 처음부터 새로운 순서로 시작해요.</span></div><div class="bar"><div style="width:${known/cs.length*100}%"></div></div></section><section class="panel" style="min-height:260px"><div class="row"><span class="pill">${state.idx+1} / ${cs.length}</span><span class="pill">원문 ${c.page}페이지</span><span class="grow"></span><button id="audio">🔊 발음</button></div><p class="muted">한국어를 보고 영어로 말해 보세요.</p><div class="big">${esc(c.ko)}</div>${state.reveal?`<hr style="border:0;border-top:1px solid #eee"><div class="answer">${esc(c.en)}</div>`:''}<div style="margin-top:25px"><button class="primary" id="reveal">${state.reveal?'정답 가리기':'영어 정답 보기'}</button></div></section><section class="panel"><div class="row"><button id="prev">◀ 이전</button><button id="miss">다시 외울래요</button><button id="know">✓ 외웠어요</button><button id="next">다음 ▶</button></div></section>`;document.getElementById('reshuffle').onclick=reshuffleCards;document.getElementById('reveal').onclick=()=>{state.reveal=!state.reveal;render()};document.getElementById('audio').onclick=()=>speak(c.en);document.getElementById('prev').onclick=()=>{state.idx=(state.idx-1+cs.length)%cs.length;state.reveal=false;save();render()};document.getElementById('next').onclick=()=>{state.idx=(state.idx+1)%cs.length;state.reveal=false;save();render()};document.getElementById('know').onclick=()=>{progress[id(c)]=true;delete mistakes[id(c)];state.idx=(state.idx+1)%cs.length;state.reveal=false;save();render()};document.getElementById('miss').onclick=()=>{progress[id(c)]=false;mistakes[id(c)]=true;state.idx=(state.idx+1)%cs.length;state.reveal=false;save();render()}}
function startQuiz(){let cs=cards();state.quizItems=random(cs).slice(0,Math.min(10,cs.length)).map(c=>id(c));state.qi=0;state.selected=null;state.score=0;save();render()}function quiz(){let cs=cards();if(!state.quizItems.length){app.innerHTML=`<section class="panel"><div class="row">${partSel()}</div><h2>✏️ 10문제 퀴즈</h2><p>한국어 뜻을 보고 영어 표현을 골라 보세요. 틀린 문장은 오답노트에 저장됩니다.</p><button class="primary" id="start">퀴즈 시작</button></section>`;document.getElementById('start').onclick=startQuiz;return}if(state.qi>=state.quizItems.length){app.innerHTML=`<section class="panel"><h2>🎉 퀴즈 완료!</h2><p class="stat">${state.score} / ${state.quizItems.length}</p><p>틀린 문제는 오답노트에서 복습할 수 있어요.</p><button class="primary" id="restart">다시 풀기</button></section>`;document.getElementById('restart').onclick=startQuiz;return}let c=DATA.cards.find(x=>id(x)===state.quizItems[state.qi]);if(!c){state.quizItems=[];render();return}let pool=random(cs.filter(x=>id(x)!==id(c)&&x.en!==c.en)).slice(0,3);let opts=random([c,...pool]);let checked=state.selected!==null;app.innerHTML=`<section class="panel"><div class="row">${partSel()}<span class="pill">${state.qi+1} / ${state.quizItems.length}</span></div><div class="bar" style="margin-top:15px"><div style="width:${state.qi/state.quizItems.length*100}%"></div></div></section><section class="panel"><p class="muted">다음 한국어 표현에 맞는 영어를 선택하세요.</p><div class="big">${esc(c.ko)}</div><div style="margin-top:22px">${opts.map((o,i)=>`<button class="choice ${checked?(id(o)===id(c)?'correct':id(o)===state.selected?'wrong':''):''}" data-opt="${i}" ${checked?'disabled':''}>${i+1}. ${esc(o.en)}</button>`).join('')}</div>${checked?`<p class="${state.selected===id(c)?'correct':'wrong'}" style="padding:12px;border-radius:10px">${state.selected===id(c)?'정답이에요!':'오답이에요. 정답: '+esc(c.en)}</p><button class="primary" id="advance">${state.qi+1===state.quizItems.length?'결과 보기':'다음 문제 →'}</button>`:''}</section>`;if(!checked)document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{let o=opts[+b.dataset.opt];state.selected=id(o);if(id(o)===id(c)){state.score++}else{mistakes[id(c)]=true;progress[id(c)]=false}save();render()});else document.getElementById('advance').onclick=()=>{state.qi++;state.selected=null;save();render()}}
function wrong(){let cs=DATA.cards.filter(c=>mistakes[id(c)]);app.innerHTML=`<section class="panel"><h2>🔥 오답노트</h2><p class="muted">틀린 퀴즈 문제와 '다시 외울래요'로 표시한 카드가 모여요.</p><p class="stat">${cs.length}개</p>${cs.length?cs.map(c=>`<div style="padding:16px 0;border-top:1px solid #eee"><span class="pill">PART ${c.part} · ${c.page}페이지</span><p><b>${esc(c.ko)}</b></p><p class="answer" style="font-size:16px">${esc(c.en)}</p><button data-clear="${esc(id(c))}">✓ 외웠어요</button></div>`).join(''):'아직 복습할 문제가 없어요! 🎉'}</section>`;document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{delete mistakes[b.dataset.clear];progress[b.dataset.clear]=true;save();render()})}
render();</script></body></html>
